<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Overlay gancho</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#grad{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(180deg,rgba(40,22,14,0),rgba(40,22,14,.55) 45%,rgba(40,22,14,.78))}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .08em}
.i{display:inline-block}
.em{font-style:italic;color:#FFDFE0}
#h1,#h2{position:absolute;left:70px;right:70px;bottom:330px;text-align:center;font-family:Lora,serif;font-weight:700;color:#FCF6EC;line-height:1.08;text-shadow:0 4px 24px rgba(0,0,0,.35)}
#h1{font-size:118px}
#h2{font-size:112px}
#tag{position:absolute;left:0;right:0;bottom:250px;text-align:center;font-weight:700;font-size:30px;letter-spacing:.2em;color:#FFDFE0}
</style></head><body>
<div id="grad"></div>
<div id="h1" data-words>Tu tres leches, ¿cuánto te cuesta <em>de verdad?</em></div>
<div id="h2" data-words>Ahora sí lo sé. <em>Así lo calculo:</em></div>
<div id="tag">MI REPOSTERÍA</div>
<script src="lib.js"></script>
<script>
splitWords();
const A = 3.0; // clip A length; clip B follows
window.seek = (t) => {
  words("h1", t, 0.1, 0.15, A - 0.3, 0.25);
  words("h2", t, A + 0.15, 0.14, 2 * A - 0.2, 0.2);
  const g = clamp(prog(t, 0, 0.3)) * (1 - prog(t, 2 * A - 0.25, 2 * A));
  document.getElementById("grad").style.opacity = g;
  const k = spring(t, A + 0.9, 2.2, 0.75), o = prog(t, 2 * A - 0.25, 2 * A);
  css("tag", {opacity: clamp(k * 1.4) * (1 - o), transform: `translateY(${(1 - k) * 30}px)`});
};
window.DUR = 2 * A; window.DROP = 99;
seek(0);
</script></body></html>
